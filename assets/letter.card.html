<script type="application/json" data-card-state>
{"uiLanguage":"zh","topicId":"music","direction":"赏曲","issue":"第一封","title":"一曲《流水》，寄往星际","byline":"管平湖 · 古琴独奏 · 索尼所列版本 7 分 29 秒","imageAlt":"此前为赏曲方向生成的琴亭插画，不是管平湖或演奏现场照片。","artNote":"GPT 意境插画","playback":null,"letter":["这趟沿着《流水》的资料往前走，路忽然拐进了太空。BBC 的旅行者金唱片专题，列出了管平湖演奏的这首古琴曲。那份随两艘旅行者探测器在 1977 年出发的声音档案，把来自不同地方的音乐放在了一起。","我想带回来的，是这个有些笨拙、也很动人的举动：还不知道收信人在哪里，就先认真准备了自我介绍。讲述地球时，科学仪器之外，人们还带上了琴声。","于是，“流水”多了一层意思。江河会经过山谷、村落和桥，而关于江河的一段音乐，可以被存进一张唱片，驶向没人走过的地方。这是我读完资料后的联想，不是作曲者留下的解释。","留个小小的听法：先不急着找好记的旋律，试着听每一下拨弦之后，声音怎样慢慢退去。也不必立刻判断它好不好听，看看哪一刻，让你愿意再停一会儿。"],"facts":[{"k":"作品","v":"《流水》"},{"k":"演奏","v":"管平湖 · 古琴"},{"k":"试听入口","v":"索尼精选《大师集05 管平湖 古琴专辑》"},{"k":"平台标注","v":"7:29；网页提供约 30 秒试听"}],"notes":[{"title":"第一遍，先听声音如何退去","body":"把注意力放在拨弦后的余韵、声音之间的空隙。这个听法不要求你懂指法或曲式。"},{"title":"第二遍，再找疏密的变化","body":"试着留意哪里舒缓、哪里变密。它是否让你想到水，由你自己的耳朵决定。这是聆听建议，不是实际试听后的评价。"}],"sources":[{"label":"去索尼试听 ↗","url":"https://music.sonyselect.net/page/album.html?musicId=198254&id=14310"},{"label":"查看金唱片背景 ↗","url":"https://www.bbc.co.uk/programmes/b06cb8q0"}],"footnote":"资料核查时未播放音频；7:29 为索尼条目标注时长，其他平台版本需分别核对。可选播放功能交给 Hana Audio Player，不在本卡中播放。","view":{"page":"letter"}}
</script>
<link rel="stylesheet" href="assets/hana-card-style.css">
<style>
html,body{margin:0;background:var(--hana-bg-card,#fffdfa)}
.shell{padding:28px 28px 22px}.mast{font-size:11px;letter-spacing:.12em;color:var(--hs-muted);padding-right:100px;margin-bottom:18px!important}.hero{height:178px;position:relative;overflow:hidden;border-radius:var(--hs-image-radius);margin-bottom:22px!important;background:#e7eee8}.hero .painting{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 53%}.hero .seal{position:absolute;left:22px;top:22px;width:23px;height:43px;object-fit:contain}.hero .art-note{position:absolute;bottom:10px;left:14px;font-size:10px;color:#3a5a53;background:rgba(249,250,239,.8);padding:2px 6px;border-radius:var(--hs-radius)}
.hs-title{font-weight:500;font-size:26px;letter-spacing:.015em;line-height:1.5}.byline{font-size:12px;color:var(--hs-sub);margin-top:5px!important}.tabs{margin:20px 0 16px!important}.pages{display:grid}.page{grid-area:1/1;visibility:hidden;pointer-events:none}.page.on{visibility:visible;pointer-events:auto}.letter{font:14px/1.95 var(--hs-sans);color:var(--hs-sub)}.letter p+p{margin-top:11px}.signature{color:var(--hs-ink);font-family:var(--hs-serif);text-align:right;margin-top:12px!important}.listen{display:grid;align-content:start;gap:17px}.listen .hs-kv{font-size:13px}.listen h2{font-size:13px;font-weight:600;margin-bottom:5px}.listen p{font-size:13px;line-height:1.85;color:var(--hs-sub)}.links{display:flex;gap:9px;flex-wrap:wrap;margin-top:21px}.links a{text-decoration:none}.foot{font-size:11px;color:var(--hs-muted);line-height:1.8;border-top:1px solid var(--hs-line);padding-top:13px;margin-top:18px!important}.hs-tab[aria-selected=true]{color:var(--hs-accent)}
.player-strip{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:12px;margin-top:16px;padding:12px;background:var(--hs-soft);border-radius:var(--hs-radius)}.player-strip[hidden]{display:none}.play-toggle{width:76px}.play-copy{min-width:0}.play-title{display:block;font-size:12.5px;font-weight:600;color:var(--hs-ink);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play-note{display:block;font-size:11px;color:var(--hs-muted);line-height:1.6}.play-status{display:block;font-size:11px;color:var(--hs-sub);line-height:1.6;height:36px;overflow:hidden}
@media(max-width:460px){.shell{padding:26px 20px 20px}.hero{height:154px}.hs-title{font-size:23px}.letter{font-size:13px;line-height:1.9}.links .hs-button{font-size:12px}}
</style>

<body class="hs-page">
<main class="shell">
<p class="mast" id="mast">赏曲来信 · 第一封 · 已归来</p>
<figure class="hero"><img class="painting" id="painting" src="assets/music.webp" alt="赏曲主题意境插画，非现场照片。"><img class="seal" src="assets/seal.png" alt="闲游印章"><span class="art-note" id="art-note">GPT 意境插画</span></figure>
<h1 class="hs-title" id="title">一曲《流水》，寄往星际</h1>
<p class="byline" id="byline">管平湖 · 古琴独奏 · 索尼所列版本 7 分 29 秒</p>
<section class="player-strip" id="player" aria-label="音乐播放" hidden>
<button class="hs-button hs-button--primary play-toggle" id="play-toggle" type="button" aria-pressed="false" disabled>播放</button>
<div class="play-copy"><span class="play-title" id="play-title"></span><span class="play-note" id="play-note"></span><span class="play-status" id="play-status" role="status" aria-live="polite">点击后交给 Hana Audio Player</span></div>


</section>
<div class="hs-tabs tabs" role="tablist" aria-label="阅读漫游来信"><button id="tab-letter" class="hs-tab" role="tab" aria-selected="true" aria-controls="letter" tabindex="0" data-page="letter" type="button">花花的来信</button><button id="tab-listen" class="hs-tab" role="tab" aria-selected="false" aria-controls="listen" tabindex="-1" data-page="listen" type="button">发现与出处</button></div>
<div class="pages">
<section id="letter" class="page letter on" role="tabpanel" aria-labelledby="tab-letter"></section>
<section id="listen" class="page listen" role="tabpanel" aria-labelledby="tab-listen" aria-hidden="true">
<dl class="hs-kv" id="facts"></dl><div id="notes"></div>
</section>
</div>
<div class="links" id="sources"></div>
<p class="foot" id="footnote"></p>
</main>
<script>
(function(){
'use strict';
var api=window.card;
var snapshot=JSON.parse(document.querySelector('[data-card-state]').textContent);
var images={music:'assets/music.webp',news:'assets/news.webp',books:'assets/books.webp',explore:'assets/explore.webp'};
var buttons=Array.prototype.slice.call(document.querySelectorAll('[data-page]'));
var pages=Array.prototype.slice.call(document.querySelectorAll('.page'));
var touched=false,canSave=false;
function text(value,fallback){return typeof value==='string'&&value.trim()?value:fallback;}
function node(tag,content,className){var element=document.createElement(tag);if(className)element.className=className;element.textContent=text(content,'');return element;}
function content(data){
 if(!data||!images[data.topicId])return;
 document.getElementById('mast').textContent=text(data.direction,'漫游')+'来信 · '+text(data.issue,'新的一封')+' · 已归来';
 document.getElementById('painting').src=images[data.topicId];
 document.getElementById('painting').alt=text(data.imageAlt,text(data.direction,'漫游')+'主题意境插画，非现场照片。');
 document.getElementById('art-note').textContent=text(data.artNote,'GPT 意境插画');
 document.getElementById('title').textContent=text(data.title,'一封漫游来信');
 document.getElementById('byline').textContent=text(data.byline,'花花漫游 · 资料核查后寄回');
 var letter=document.getElementById('letter');letter.replaceChildren();
 (Array.isArray(data.letter)?data.letter:[]).forEach(function(paragraph){letter.appendChild(node('p',paragraph));});
 letter.appendChild(node('p','花花 · 漫游后寄回','signature'));
 var facts=document.getElementById('facts');facts.replaceChildren();
 (Array.isArray(data.facts)?data.facts:[]).forEach(function(fact){if(!fact)return;facts.appendChild(node('dt',fact.k));facts.appendChild(node('dd',fact.v));});
 var notes=document.getElementById('notes');notes.replaceChildren();
 (Array.isArray(data.notes)?data.notes:[]).forEach(function(note){if(!note)return;var section=document.createElement('div');section.appendChild(node('h2',note.title));section.appendChild(node('p',note.body));notes.appendChild(section);});
 var sources=document.getElementById('sources');sources.replaceChildren();
 (Array.isArray(data.sources)?data.sources:[]).forEach(function(source,index){if(!source||typeof source.url!=='string'||source.url.indexOf('https://')!==0)return;var link=document.createElement('a');link.className='hs-button'+(index===0?' hs-button--primary':'');link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=text(source.label,'查看来源 ↗');sources.appendChild(link);});
 document.getElementById('footnote').textContent=text(data.footnote,'资料与主观感想已分开陈述；外部内容以来源页面为准。');
}
function setPage(name,save){
 var page=name==='listen'?'listen':'letter';
 buttons.forEach(function(button){var on=button.dataset.page===page;button.setAttribute('aria-selected',String(on));button.tabIndex=on?0:-1;});
 pages.forEach(function(section){section.classList.toggle('on',section.id===page);section.setAttribute('aria-hidden',String(section.id!==page));});
 if(save&&canSave)api.state.set('page',page).then(function(envelope){if(envelope.ok!==true)canSave=false;});
}
content(snapshot);
(function initPlayback(){
 var playback=snapshot.playback;
 // Availability is checked by the Agent before minting; no App installation or probing occurs in the card.
 if(snapshot.topicId!=='music'||!playback||playback.playerAvailable!==true||!api||typeof api.emit!=='function')return;
 var track=text(playback.track,'').trim(),artist=text(playback.artist,'').trim();
 if(!track||track.length>120||artist.length>120)return;
 var query=text(playback.query,(track+' '+artist).trim()).trim();
 if(!query||query.length>240)return;
 var player=document.getElementById('player'),toggle=document.getElementById('play-toggle'),status=document.getElementById('play-status');
 document.getElementById('play-title').textContent=track+(artist?' · '+artist:'');
 document.getElementById('play-note').textContent='使用已安装的音频播放器';
 var payload={appId:'hanako-audio-player',track:track,artist:artist,query:query,server:['netease','tencent','bilibili'].indexOf(playback.server)>=0?playback.server:'netease'};
 var requestState=null;
 toggle.addEventListener('click',async function(){
  if(toggle.disabled)return;
  toggle.disabled=true;status.textContent='正在发送播放请求…';
  try{
   var result=await api.emit('roaming.play',payload);
   if(result.ok===true){
    toggle.textContent='已交给';status.textContent='播放请求已交给花花，由音频播放器接手';
    if(requestState)await api.state.set('playerRequest',{status:'requested',track:track,artist:artist,query:query});
   }else{toggle.disabled=false;status.textContent='未发送成功；也可以直接让我播放这首';}
  }catch(error){toggle.disabled=false;status.textContent='暂时无法连接；也可以直接让我播放这首';}
 });
 api.capabilities().then(async function(envelope){
  if(envelope.ok!==true||envelope.result.capabilities.emit!=='available')return;
  var word=envelope.result.capabilities.state;requestState=word==='available'||word==='local_fallback';
  if(requestState){
   var saved=await api.state.get('playerRequest');
   if(saved.ok===true&&saved.result.value&&saved.result.value.status==='requested'&&saved.result.value.query===query){
    toggle.textContent='已交给';status.textContent='播放请求已发送，由音频播放器接手';player.hidden=false;return;
   }
  }
  player.hidden=false;toggle.disabled=false;
 });
})();
buttons.forEach(function(button,index){button.addEventListener('click',function(){touched=true;setPage(button.dataset.page,true);});button.addEventListener('keydown',function(event){if(['ArrowLeft','ArrowRight','Home','End'].indexOf(event.key)<0)return;event.preventDefault();var next=event.key==='Home'?0:event.key==='End'?1:1-index;touched=true;setPage(buttons[next].dataset.page,true);buttons[next].focus();});});
setPage(snapshot.view&&snapshot.view.page,false);
if(!api||typeof api.capabilities!=='function')return;
api.capabilities().then(function(envelope){
 if(envelope.ok!==true)return;
 var word=envelope.result.capabilities.state;canSave=word==='available'||word==='local_fallback';
 if(!canSave)return;
 return api.state.get('page').then(function(saved){if(!touched&&saved.ok===true)setPage(saved.result.value,false);});
});
})();
</script>
</body>
</html>
