<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花花漫游 · 山水来信</title>
<script type="application/json" data-card-manifest>
{"spec":"1.0","display":{"styleProfile":"custom","preferredWidthPx":660},"packageAssets":["assets/hana-card-style.css","assets/music.webp","assets/news.webp","assets/books.webp","assets/explore.webp","assets/seal.png"]}
</script>
<script type="application/json" data-card-state>
{"uiLanguage":"zh","trip":{"selected":0,"direction":"赏曲","topicId":"music","status":"ready","art":"gpt-landscape-and-seal"}}
</script>
<link rel="stylesheet" href="assets/hana-card-style.css">
<style>
html,body{margin:0;padding:0;background:var(--hana-bg-card,#fffdfa)}
.trip-shell{max-width:760px;margin:auto;padding:28px 28px 22px}
.mast{display:flex;align-items:center;gap:9px;padding-right:100px;margin-bottom:18px!important;font-size:11px;letter-spacing:.13em;color:var(--hs-muted)}
.mast svg{width:17px;height:17px;flex:none;color:var(--hs-accent)}
.hs-title.trip-title{font-size:28px;line-height:1.45;font-weight:500;letter-spacing:.025em;margin-bottom:7px}
.trip-lead{font-size:13px;line-height:1.8;color:var(--hs-sub)}
.landscape{position:relative;margin-top:23px!important;overflow:hidden;isolation:isolate;border-radius:var(--hs-image-radius);background:#edf0e7;aspect-ratio:2.35/1;min-height:240px}
.landscape .painting{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:center;opacity:0;visibility:hidden;transition:opacity .4s ease;pointer-events:none}
.landscape .painting.active{opacity:1;visibility:visible}
.art-caption{position:absolute;top:23px;left:24px;color:#304b43;text-shadow:0 1px 8px rgba(250,250,241,.4)}
.art-caption h2{font:500 25px/1.5 var(--hs-serif);letter-spacing:.12em}
.art-caption p{font:12px/1.8 var(--hs-serif);letter-spacing:.06em;margin-top:5px!important}
.art-seal{position:absolute;left:25px;top:96px;width:24px;height:43px;object-fit:contain}
.destinations.hs-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;padding:4px;gap:4px;margin:18px 0 0}
.destinations .hs-tab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:39px;padding:7px 6px;font-size:13px;white-space:nowrap}
.destinations .hs-icon{width:15px;height:15px;stroke-width:1.5;pointer-events:none}
.destinations .hs-tab[aria-selected=true]{color:var(--hs-accent)}
.destinations .hs-tab:disabled{cursor:default}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;margin-top:22px}
.detail-text h2{font:500 20px/1.5 var(--hs-serif);margin-bottom:5px!important}
.detail-text p{font-size:12.5px;line-height:1.8;color:var(--hs-sub);min-height:45px}
.dispatch{min-width:126px;min-height:40px;padding-inline:15px;font-size:13px}
.trip-footer{display:flex;align-items:flex-start;gap:8px;margin-top:17px!important;padding-top:13px;border-top:1px solid var(--hs-line);font-size:11.5px;line-height:1.7;min-height:54px;color:var(--hs-muted)}
.trip-footer .hs-icon{width:13px;height:13px;flex:none;margin-top:3px;stroke-width:1.5}
.status-message{flex:1;min-width:0}
.art-source{font-size:10.5px;color:var(--hs-muted);opacity:.8;line-height:1.6;margin-top:2px!important}
@media(max-width:460px){.trip-shell{padding:26px 20px 19px}.mast{font-size:10px;letter-spacing:.06em}.hs-title.trip-title{font-size:25px}.landscape{min-height:220px;margin-top:20px!important}.landscape .painting{object-position:55% center}.art-caption{left:18px;top:20px}.art-caption h2{font-size:23px}.art-caption p{font-size:11px}.art-seal{left:19px;top:89px;width:22px;height:40px}.destinations .hs-tab{gap:5px;font-size:12px}.destinations .hs-icon{display:none}.detail-grid{gap:12px;grid-template-columns:minmax(0,1fr)}.dispatch{justify-self:stretch}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body class="hs-page">
<main class="trip-shell">
<header>
<p class="mast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M12 20c-5-2-8-6-7-10 3 0 6 2 7 5 1-3 4-5 7-5 1 4-2 8-7 10Z"/><path d="M12 15C8 11 8 7 12 3c4 4 4 8 0 12Z"/></svg><span>花花的漫游手帖</span></p>
<h1 class="hs-title trip-title">出门，拾一点故事。</h1>
<p class="trip-lead">你选一个方向，我带一段见闻回来。</p>
</header>
<figure class="landscape" id="landscape">
<img class="painting active" data-art="0" src="assets/music.webp" alt="赏曲主题国风画，GPT 原创想象画面。">
<img class="painting" data-art="1" src="assets/news.webp" alt="时事主题国风画，GPT 原创想象画面，不是新闻现场照片。" aria-hidden="true">
<img class="painting" data-art="2" src="assets/books.webp" alt="书籍主题国风画，GPT 原创想象画面。" aria-hidden="true">
<img class="painting" data-art="3" src="assets/explore.webp" alt="自由探索主题国风画，GPT 原创想象画面。" aria-hidden="true">
<div class="art-caption"><h2 id="art-title">弦外有山水</h2><p id="art-verse">寻一段旋律，听一段来处。</p></div>
<img class="art-seal" src="assets/seal.png" alt="闲游朱砂小印章" width="29" height="49">
</figure>
<div class="hs-tabs destinations" id="choices" role="tablist" aria-label="选择探索方向">
<button id="pick-0" class="hs-tab" role="tab" aria-selected="true" aria-controls="trip-detail" tabindex="0" data-index="0" type="button"><svg class="hs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg>赏曲</button>
<button id="pick-1" class="hs-tab" role="tab" aria-selected="false" aria-controls="trip-detail" tabindex="-1" data-index="1" type="button"><svg class="hs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h15v16H5a2 2 0 0 1-2-2V8h2V4ZM5 8v10M9 8h7M9 12h7M9 16h7"/></svg>时事</button>
<button id="pick-2" class="hs-tab" role="tab" aria-selected="false" aria-controls="trip-detail" tabindex="-1" data-index="2" type="button"><svg class="hs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v15M12 6C8 3 5 3 2 4v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-6-1-10 2Z"/></svg>书籍</button>
<button id="pick-3" class="hs-tab" role="tab" aria-selected="false" aria-controls="trip-detail" tabindex="-1" data-index="3" type="button"><svg class="hs-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6 6-2Z"/></svg>自由探索</button>
</div>
<section class="detail-grid" id="trip-detail" role="tabpanel" aria-labelledby="pick-0">
<div class="detail-text"><h2 id="direction">赏曲</h2><p id="description">寻一首耐听的曲子，带回旋律背后的故事。</p></div>
<button type="button" class="hs-button hs-button--primary dispatch" id="dispatch" disabled><span id="button-label">派花花出发</span><svg class="hs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
</section>
<div class="trip-footer"><svg class="hs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3ZM3 5l9 8 9-8"/></svg><div class="status-message"><p id="status" role="status" aria-live="polite">联网探索 · 带回发现与出处</p><p class="art-source">画作与印章由 GPT 生成 · 画境为艺术想象</p></div></div>
</main>
<script>
(function(){
'use strict';
const trips=[
{id:'music',direction:'赏曲',title:'弦外有山水',verse:'寻一段旋律，听一段来处。',description:'寻一首耐听的曲子，带回旋律背后的故事。',brief:'选择一首值得听的曲子，核查作品信息、欣赏线索与故事；检查当前会话能否调用已启用的 Hana Audio Player（hanako-audio-player）。可用时在名片提供联动播放按钮，不可用时只读。未实际听取时不编造试听体验。'},
{id:'news',direction:'时事',title:'人间正此时',verse:'看见发生，也读懂缘由。',description:'看一件值得关心的近事，理清来龙去脉。',brief:'查找当前值得关注的新闻，核对可靠来源，标明事件和报道日期，区分已确认事实、各方说法与分析。'},
{id:'books',direction:'书籍',title:'书里有远山',verse:'翻一页书，向内走远一点。',description:'翻开一本值得读的书，带回一页思想与回响。',brief:'选择一本书或一个书中议题，带回可靠书目信息、值得读的理由与有出处的发现；不得捏造引文或把未读全书说成已读全书。'},
{id:'explore',direction:'自由探索',title:'山外还有山',verse:'把下一程，交给好奇心。',description:'不预设去处，由花花带回一点意外发现。',brief:'自行选择一个范围适中的有趣主题，进行真实探索，带回有来源的新发现；不要重复泛泛的常识，不伪装成现实中的亲历。'}
];
const byId=id=>document.getElementById(id);
const tabs=Array.from(document.querySelectorAll('[data-index]'));
const paintings=Array.from(document.querySelectorAll('[data-art]'));
let selected=0,busy=false,sent=false,caps=null,canSend=false,interacted=false;
const stateAvailable=()=>caps&&(caps.state==='available'||caps.state==='local_fallback');
function snapshot(){return {selected,direction:trips[selected].direction,topicId:trips[selected].id,status:sent?'requested':'ready',art:'gpt-landscape-and-seal'};}
function persist(){if(stateAvailable())window.card.state.set('trip',snapshot());}
function render(){
 paintings.forEach((image,i)=>{image.classList.toggle('active',i===selected);image.setAttribute('aria-hidden',String(i!==selected));});
 byId('art-title').textContent=trips[selected].title;
 byId('art-verse').textContent=trips[selected].verse;
 byId('direction').textContent=trips[selected].direction;
 byId('description').textContent=trips[selected].description;
 tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===selected));tab.tabIndex=i===selected?0:-1;tab.disabled=busy||sent;});
 byId('trip-detail').setAttribute('aria-labelledby','pick-'+selected);
 byId('dispatch').disabled=!canSend||busy||sent;
 byId('button-label').textContent=sent?'邀请已寄出':busy?'正在寄出…':'派花花出发';
}
function choose(i){if(busy||sent)return;interacted=true;selected=(i+4)%4;render();persist();}
tabs.forEach((tab,i)=>{
 tab.addEventListener('click',()=>choose(i));
 tab.addEventListener('keydown',event=>{
  let next=null;
  if(event.key==='ArrowRight')next=(selected+1)%4;
  if(event.key==='ArrowLeft')next=(selected+3)%4;
  if(event.key==='Home')next=0;
  if(event.key==='End')next=3;
  if(next!==null){event.preventDefault();choose(next);tabs[selected].focus();}
 });
});
byId('dispatch').addEventListener('click',async()=>{
 if(busy||sent||!canSend)return;
 busy=true;render();byId('status').textContent='正在把探索方向送到这段聊天…';
 try{
  const result=await window.card.emit('trip.request',{direction:trips[selected].direction,topicId:trips[selected].id,brief:trips[selected].brief,mode:'online-research',returnWith:'有来源的发现、一段漫游来信和一张结果卡片'});
  if(result.ok===true){sent=true;persist();byId('status').textContent='邀请已送达；探索结果会回到这段聊天。';}
  else byId('status').textContent='这次没有寄出，请重试，或在聊天里告诉我方向。';
 }catch(error){byId('status').textContent='暂时无法连接；可以直接在聊天里告诉我方向。';}
 busy=false;render();
});
(async()=>{
 if(!window.card||!window.card.capabilities){byId('status').textContent='可选择探索方向；派出邀请需要在 Hana 中打开。';return;}
 const envelope=await window.card.capabilities();
 caps=envelope.ok===true?envelope.result.capabilities:null;
 canSend=!!(caps&&caps.emit==='available');
 if(stateAvailable()){
  const saved=await window.card.state.get('trip');
  const value=saved.ok===true?saved.result.value:null;
  if(value&&Number.isInteger(value.selected)&&value.selected>=0&&value.selected<4&&!interacted){selected=value.selected;sent=value.status==='requested';}
 }
 if(sent)byId('status').textContent='邀请已送达；探索结果会回到这段聊天。';
 else if(!canSend)byId('status').textContent='这里暂不能派出；可在聊天里直接告诉我方向。';
 render();persist();
})();
})();
</script>
</body>
</html>
